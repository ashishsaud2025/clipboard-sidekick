[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipboard-sidekick"
version = "0.1.0"
description = "Local-first LLM popups that explain whatever you copy, triggered by a global hotkey."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.6",
    "pynput>=1.8",
    "psutil>=5.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["clipboard_sidekick*"]
